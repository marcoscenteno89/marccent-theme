# The markup reference matches the components, and dist/ is what the source builds.
name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: dist/ is up to date
        run: |
          git diff --exit-code -- dist || { echo "dist/ is out of date: run npm run build and commit it."; exit 1; }
