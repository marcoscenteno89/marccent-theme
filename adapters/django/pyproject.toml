[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marccent-theme"
dynamic = ["version"]
description = "The Marccent theme in Django: template tags that load its prebuilt dist/ (CSS, design styles, the plain-JS engine) at a pinned version."
readme = "README.md"
license = { text = "ISC" }
authors = [{ name = "Marcos Centeno" }]
requires-python = ">=3.10"
dependencies = ["Django>=4.2"]

[project.urls]
Homepage = "https://github.com/marcoscenteno89/marccent-theme"

[tool.setuptools.packages.find]
include = ["marccent_theme*"]

[tool.setuptools.dynamic]
version = { attr = "marccent_theme.__version__" }
